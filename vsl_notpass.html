<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>垢抜け恋愛カレッジ｜審査結果のお知らせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f2f3f5;--ink:#1e2a44;--mute:#8b95a5;--peach:#cfe0f2;--line:#dfe4ea}
  *{box-sizing:border-box}
  body{margin:0;background:#e2e6ec;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);font-size:15px;line-height:2.15;font-weight:400;letter-spacing:.02em}
  .phone{max-width:430px;margin:24px auto;background:var(--bg);box-shadow:0 4px 30px rgba(0,0,0,.12);min-height:90vh}
  .blk{padding:56px 30px}
  .c{text-align:center}
  .en{font-size:10.5px;letter-spacing:.34em;color:#93aac9;margin:0 0 14px}
  h1{font-size:23px;font-weight:600;line-height:1.8;margin:0 0 20px;letter-spacing:.08em}
  h2{font-size:17px;font-weight:600;line-height:1.8;margin:0 0 18px;letter-spacing:.08em}
  p{margin:0 0 1.5em}
  p:last-child{margin-bottom:0}
  .sub{font-size:14px;color:#4f5866}
  .mark{background:linear-gradient(transparent 62%,var(--peach) 62%)}
  .hair{width:44px;height:1px;background:linear-gradient(90deg,var(--ink),#9db4d0);margin:0 auto 24px}
  .video{padding:0 18px}
  .video .frame{position:relative;width:100%;padding-top:56.25%;background:#18181b;border-radius:14px;overflow:hidden}
  .video .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .list{list-style:none;padding:0;margin:22px 0}
  .list li{padding:11px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.7}
  .list li:last-child{border-bottom:1px solid var(--line)}
  .steps{list-style:none;padding:0;margin:22px 0;counter-reset:s}
  .steps li{position:relative;padding:12px 0 12px 44px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.7;counter-increment:s}
  .steps li:last-child{border-bottom:1px solid var(--line)}
  .steps li::before{content:counter(s);position:absolute;left:4px;top:14px;width:26px;height:26px;border-radius:50%;background:#33456b;color:#fff;font-size:12px;line-height:26px;text-align:center;letter-spacing:0}
  .steps small{display:block;font-size:12.5px;color:var(--mute);line-height:1.6;margin-top:2px}
  .note{margin:26px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
  .note h3{font-size:15px;font-weight:600;margin:0 0 8px;letter-spacing:.06em;color:#33456b}
  .note p{font-size:14px;color:#4f5866;line-height:2}
  .btn{display:block;text-align:center;background:linear-gradient(135deg,#3a4f77,#22304e);color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;font-size:15px;letter-spacing:.12em;margin:22px auto 8px;max-width:300px;text-decoration:none}
  .btncap{font-size:12px;color:var(--mute);text-align:center;margin:0}
  footer{padding:20px 30px 30px;font-size:11px;color:var(--mute);text-align:center}
  footer a{color:var(--mute)}
</style>
</head>
<body>
<div class="phone">

<!-- タイトル -->
<div class="blk c" style="padding-bottom:28px">
  <p class="en">MESSAGE FROM HARE</p>
  <h1>審査フォームのご提出、<br>ありがとうございます。</h1>
  <div class="hair"></div>
  <p class="sub">審査の結果をお伝えします。<br>まずは、この動画を見てもらえたら嬉しいです。</p>
</div>

<!-- 動画 -->
<div class="video">
  <div class="frame">
    <iframe src="https://www.youtube.com/embed/kWU-hutwjrM?rel=0" title="ハレからのお知らせ（審査結果）" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>

<!-- 締め -->
<div class="blk c" style="padding:48px 30px 48px">
  <p class="en">FROM HARE</p>
  <p class="sub">第2期の募集が決まったら、<br>今回提出してくださった方に<br>LINEで先にご案内します。<br>このLINEは、そのまま残しておいてください。</p>
  <div class="hair" style="margin-top:28px"></div>
  <p class="sub">これからも、YouTubeとLINEで<br>発信を続けていきます。<br>いつも応援してくれて、ありがとうございます。</p>
</div>

<footer><a href="https://course-site-bay.vercel.app/tokusho.html">特定商取引法に基づく表記</a> ／ <a href="https://course-site-bay.vercel.app/privacy.html">プライバシーポリシー</a><br>運営：ハレ</footer>
</div>
</body>
</html>
